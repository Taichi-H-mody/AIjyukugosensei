<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI熟語先生 - 漢字一文字を入力するとAIが熟語を自動生成し、意味と例文を表示します。">
    <title>AI熟語先生</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-overlay"></div>

    <main class="container">
        <header class="app-header">
            <div class="header-icon">📖</div>
            <h1 class="app-title" id="app-title">AI熟語先生</h1>
            <p class="app-subtitle">漢字一文字から、熟語の世界を広げよう</p>
        </header>

        <!-- Offline Mode Notice -->
        <div style="text-align: center; margin-bottom: 20px; color: #4b5563; font-size: 0.9rem;">
            <p>※現在、約2000語の大増量完全オフライン辞書モードで動作しています</p>
        </div>

        <!-- Search Section -->
        <section class="search-section" id="search-section">
            <div class="input-group">
                <label for="kanji-input" class="input-label">漢字を一文字入力してください（小学６年生の配当漢字）</label>
                <div class="input-wrapper">
                    <input type="text" id="kanji-input" class="kanji-input" maxlength="1" placeholder="例：誠" autocomplete="off">
                </div>
                <button id="generate-btn" class="generate-btn" onclick="generateJukugo()">
                    <span class="btn-icon">🖌️</span>
                    <span>熟語を生成する</span>
                </button>
                <p id="error-msg" class="error-msg" role="alert"></p>
            </div>
        </section>

        <!-- Kanji Grid -->
        <details class="kanji-grid-wrap" id="kanji-grid-wrap">
            <summary class="kanji-grid-toggle">📋 ６年生の配当漢字一覧を見る</summary>
            <div class="kanji-grid" id="kanji-grid"></div>
        </details>

        <!-- Results Section -->
        <section class="results-section" id="results-section" aria-live="polite">
            <div id="results-container" class="results-container"></div>
        </section>
    </main>

    <footer class="app-footer">
        <p>© 2026 AI熟語先生 ｜ Powered by Gemini AI</p>
    </footer>

    <script src="kanji-list.js"></script>
    <script src="data-1.js"></script>
    <script src="data-2.js"></script>
    <script src="data-3.js"></script>
    <script src="data-4.js"></script>
    <script src="data-5.js"></script>
    <script src="data-6.js"></script>
    <script src="data-extra-1.js"></script>
    <script src="data-extra-2.js"></script>
    <script src="data-extra-3.js"></script>
    <script src="data-extra-4.js"></script>
    <script src="data-extra-5.js"></script>
    <script src="data-extra-6.js"></script>
    <script src="data-auto.js"></script>
    <script src="script.js"></script>
</body>
</html>
