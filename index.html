<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI熟語先生 - 漢字一文字を入力するとAIが熟語を自動生成し、意味と例文を表示します">
    <title>AI熟語先生</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-overlay"></div>

    <main class="container">
        <header class="app-header">
            <div class="header-icon">📖</div>
            <h1>AI熟語先生</h1>
            <p>漢字一文字から、関連する熟語をAIが自動生成します</p>
        </header>

        <section class="search-section">
            <div class="input-group">
                <input type="text" id="kanji-input" placeholder="漢字を一文字入力してください (例: 海)" maxlength="1">
                <button id="search-btn">熟語を生成する</button>
            </div>
            <div id="error-msg" class="error-msg hidden"></div>
        </section>

        <section id="loading-state" class="loading-state hidden">
            <div class="spinner"></div>
            <p>AIが熟語を生成中...</p>
        </section>

        <section id="results-section" class="results-section hidden">
            <h2 id="results-title">「<span id="target-kanji"></span>」の熟語</h2>
            <div id="jukugo-grid" class="jukugo-grid">
                <!-- Results will be dynamically inserted here -->
            </div>
            
            <div class="action-buttons">
                <button id="reset-btn" class="secondary-btn">もう一度検索する</button>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <p>&copy; 2026 AI熟語先生 Powered by Gemini AI</p>
    </footer>

    <!-- Database Scripts -->
    <script src="data-auto.js"></script>
    <script src="data-1.js"></script>
    <script src="data-2.js"></script>
    <script src="data-3.js"></script>
    <script src="data-4.js"></script>
    <script src="data-5.js"></script>
    <script src="data-6.js"></script>
    <script src="data-extra-1.js"></script>
    <script src="data-extra-2.js"></script>
    <script src="data-extra-3.js"></script>
    <script src="data-extra-4.js"></script>
    <script src="data-extra-5.js"></script>
    <script src="data-extra-6.js"></script>
    
    <!-- Application Logic -->
    <script src="main.js"></script>
</body>
</html>
